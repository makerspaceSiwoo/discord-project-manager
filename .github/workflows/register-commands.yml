name: Register Discord commands
on:
  workflow_dispatch:
    inputs:
      guild_id:
        description: Discord server ID
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: discord-command-registration
  cancel-in-progress: false
jobs:
  register:
    if: github.ref == 'refs/heads/main' && github.actor == github.repository_owner && github.triggering_actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: node scripts/register-commands.mjs
        env:
          GUILD_ID: ${{ inputs.guild_id }}
          DISCORD_APPLICATION_ID: ${{ vars.DISCORD_APPLICATION_ID }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
